version: '3.8'

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    container_name: scry-quest-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: scry_quest_dev
      POSTGRES_USER: scry_quest
      POSTGRES_PASSWORD: scry_quest_dev
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >
      postgres
      -c shared_buffers=256MB
      -c maintenance_work_mem=64MB
      -c work_mem=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scry_quest -d scry_quest_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  scry_quest:
    driver: bridge

volumes:
  postgres_data:
    driver: local